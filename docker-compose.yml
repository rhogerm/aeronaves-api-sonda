services:
  postgres:
    image: postgres:16-alpine
    container_name: aeronaves-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeronaves_db
      POSTGRES_USER: aeronaves
      POSTGRES_PASSWORD: aeronaves
    ports:
      - "5432:5432"
    volumes:
      - aeronaves-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronaves -d aeronaves_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aeronaves-pgdata:
